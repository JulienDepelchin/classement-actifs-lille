name: poll-ter-rt

# Capture la ponctualite reelle des TER vers Lille via le GTFS-RT SNCF.
# DECLENCHEMENT : cron externe (cron-job.org) qui appelle l'API workflow_dispatch toutes les
# 10 min (le planificateur natif de GitHub etant trop peu fiable). Voir data/rt/README.md.
# Chaque run poll ~8 min (loop interne toutes les 75 s) puis 1 commit.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "duree du loop (min) -- garder < intervalle du cron externe"
        default: "5"

concurrency:
  group: poll-ter-rt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet gtfs-realtime-bindings

      - name: poll
        run: python scripts/poll_ter_rt.py --loop "${{ github.event.inputs.minutes || '8' }}"

      - name: commit
        run: |
          git config user.name  "ter-rt-bot"
          git config user.email "actions@github.com"
          git add data/rt/updates
          if git diff --cached --quiet; then
            echo "rien a committer"
            exit 0
          fi
          git commit -m "rt: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push retry $i"; sleep 5
          done
