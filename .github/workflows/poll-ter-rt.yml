name: poll-ter-rt

# Capture la ponctualite reelle des TER vers Lille via le GTFS-RT SNCF.
# Toute la journee de service, 7j/7 (heure de Paris = UTC+2 jusqu'au 25/10/2026, puis UTC+1) :
#   03:00-21:00 UTC = ~05:00-23:00 Paris  -> couvre le 1er et le dernier TER.
# Cron toutes les 10 min ; chaque run poll ~8 min (loop interne toutes les 75 s) puis 1 commit.
# GitHub peut retarder/sauter des runs sous charge : sans gravite pour cet usage.

on:
  schedule:
    - cron: "*/10 3-21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "duree du loop (min)"
        default: "8"

concurrency:
  group: poll-ter-rt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet gtfs-realtime-bindings

      - name: poll
        run: python scripts/poll_ter_rt.py --loop "${{ github.event.inputs.minutes || '8' }}"

      - name: commit
        run: |
          git config user.name  "ter-rt-bot"
          git config user.email "actions@github.com"
          git add data/rt/updates
          if git diff --cached --quiet; then
            echo "rien a committer"
            exit 0
          fi
          git commit -m "rt: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push retry $i"; sleep 5
          done
