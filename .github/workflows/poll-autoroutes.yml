name: poll-autoroutes

# Fiabilite des autoroutes vers Lille : temps de trajet en direct (trafic live TomTom) depuis
# 12 villes d'entree de l'agglomeration. Un instantane par run.
# DECLENCHEMENT : Cloudflare Worker -> API workflow_dispatch (comme poll-ter-rt), ~toutes les 10 min.

on:
  workflow_dispatch:

concurrency:
  group: poll-autoroutes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: poll
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python scripts/poll_autoroutes_tomtom.py

      - name: commit
        run: |
          git config user.name  "autoroutes-bot"
          git config user.email "actions@github.com"
          git add data/rt/autoroutes
          if git diff --cached --quiet; then echo "rien a committer"; exit 0; fi
          git commit -m "autoroutes: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
            echo "push retry $i"; sleep 5
          done
